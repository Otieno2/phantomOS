// apt.conf — live-build copies this to the chroot's /etc/apt/apt.conf in
// chroot_apt install (its "Configuring apt config" step) and deletes it again in
// chroot_apt remove, before the chroot is copied into the image. So it is a build-time
// fetch setting, not shipped content; §9.1's leak checks still confirm nothing of ours
// reaches the image.
//
// Added after run K (2026-10-31) lost the WSL resolver mid-build, and then found to be
// very nearly a placebo. What each line is actually worth, measured on run L
// (logs/M1-runL-binary-rootfs-dns.txt):
//
// Acquire::Retries "5" — redundant. /usr/share/live/build/functions/configuration.sh:120
//   sets APT_OPTIONS="${APT_OPTIONS:---yes -o Acquire::Retries=5}", and every apt call that
//   touches the network in live-build passes ${APT_OPTIONS} on the command line
//   (chroot_archives:262/280, chroot_install-packages:88, packages.sh:56 Install_packages,
//   binary_package-lists:69, installer_debian-installer:546). A command-line -o wins over
//   any config file, so this line changes nothing. Run L's five Ign:/Err: pairs per package
//   are live-build's default doing its work with this file already in the tree — and the
//   outage outlasted them.
//
// Acquire::http::Timeout "30" — the only setting here that this file is the source of, and
//   it shortens apt's default 120 s connect/read timeout. It does nothing at all for the
//   failure that motivated the file: "Temporary failure resolving" is the resolver answering
//   with nothing, which is immediate, not a timeout.
//
// So neither line prevents the run K / run L class of failure, and this file is kept as the
// record of that rather than as a mitigation. What does prevent the .deb half of it is
// scripts/seed-binary-cache.sh, which stops binary_rootfs needing the network at all. The
// resolver half is a host property — one nameserver, 10.255.255.254, no fallback — and is
// not configurable from this repository.
//
// Not covered by anything here: debootstrap's own fetches, which run before chroot_apt
// install and so never see this file.
Acquire::Retries "5";
Acquire::http::Timeout "30";
